<!-- navbar.component.html -->
<div>
  <!-- NAVBAR -->
  <nav
    class="navbar">
    <!-- logo y nombre -->
    <div class="flex items-center mr-3" routerLink="home" (click)="borrarFiltros($event)">
      <img src="/svg/logo.svg" alt="GeoMarket Logo" class="cursor-pointer" (click)="borrarFiltros($event)" />
      <img src="/svg/geomarket.svg" alt="" class="cursor-pointer hidden md:block" />
    </div>

    <!-- input y lupa -->
    <div class="flex-1 flex justify-center z-50">
      <form class="flex items-center" autocomplete="off" (ngSubmit)="searchPublicationByName(searchPublication.value)"
        #searchForm="ngForm">

        <div class="relative max-w-[200px]">
          <input type="text" name="searchPublication" placeholder="Busca aquí" #searchPublication="ngModel" ngModel
            required (focus)="onFocusSearch()" (blur)="onBlurSearch()" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
            class="searchInput" />
        </div>

        <button type="submit" [disabled]="searchPublication.invalid">
          <img src="/svg/lupa.svg" alt="" class="cursor-pointer ml-2" />
        </button>
      </form>

      @if (showHistory) {
      <!-- historial -->
      <div class="absolute top-16">
        <app-search-history></app-search-history>
      </div>
      }
    </div>



    <!-- tema y menú -->
    <div>
      <div class="flex items-center gap-x-2 ml-4">
        <img src="/svg/teme.svg" alt="Tema" class="cursor-pointer" />
        <img src="/svg/menu.svg" class="cursor-pointer" (click)="toggleMenu()" />
      </div>
    </div>
  </nav>

  <!-- OVERLAY para cerrar sidebar cuando se hace click fuera -->
  <div *ngIf="open" class="fixed inset-0 z-40" (click)="closeMenu()">
  </div>

  <!-- SIDEBAR -->
  <div
    class="fixed top-16 right-0 h-[calc(100vh-4rem)] w-[280px] md:w-[320px] bg-white shadow-lg z-50 transition-transform duration-300 transform"
    [class.translate-x-0]="open" [class.translate-x-full]="!open">

    <div class="h-full w-full">
      @switch (role) {
      @case ('Vendedor') {
      <app-seller-slidebar />
      }
      @case ('consumidor') {
      <app-buyer />
      }
      @case ('guest') {
      <app-guest />
      }
      @case ('Admin') {
      <app-admin />
      }
      @default {
      <div class="h-full flex items-center justify-center text-gray-500">
        <p>No hay sidebar disponible</p>
      </div>
      }
      }
    </div>
  </div>
</div>
