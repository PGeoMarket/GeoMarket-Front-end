<div class="bg-white flex flex-col items-center p-4 ">
            <img [src]="user?.image?.url || '/svg/profile.svg'" alt="Perfil" class="object-cover rounded-full w-30 h-30">
            <p class="text-azulPotente text-sm md:text-lg mt-2">{{user?.primer_nombre}} {{user?.segundo_nombre}}</p>
            <p class="text-[#4690FF] text-xs md:text-base">Consumidor</p>
            <p class="bg-[#06406A] text-white py-1 px-3 md:px-5 w-fit rounded-[16px] mt-2 md:mt-3 text-xs md:text-sm cursor-pointer" routerLink="/profile-buyer">
                Perfil</p>
        </div>

<!-- Menú -->
<div class="bg-[#06406A] h-full flex flex-col">

  <!-- Home -->
  <div class="flex items-center py-3 sm:py-3 md:py-2 lg:py-3 px-3 cursor-pointer" routerLink="home">
    <img src="/svg/home.svg" class="inline w-8 h-8 sm:w-8 sm:h-8 md:w-6 md:h-6 lg:w-9 lg:h-9" />
    <p class="text-white inline ml-3 text-lg sm:text-xl md:text-[1.1em] lg:text-[1.3em]">Inicio</p>
  </div>

  <!-- Favoritos -->
  <div class="flex items-center py-3 sm:py-3 md:py-2 lg:py-3 px-3 cursor-pointer" routerLink="favorite-publications">
    <img src="svg/favorites.svg" class="inline w-8 h-8 sm:w-8 sm:h-8 md:w-6 md:h-6 lg:w-9 lg:h-9" />
    <p class="text-white inline ml-3 text-lg sm:text-xl md:text-[1.1em] lg:text-[1.3em] cursor-pointer">
      Favoritos
    </p>
  </div>

  <!-- Mensajes -->
  <div class="flex items-center py-3 sm:py-3 md:py-2 lg:py-3 px-3 cursor-pointer" routerLink="/chats">
    <img src="svg/messages.svg" class="inline w-8 h-8 sm:w-8 sm:h-8 md:w-6 md:h-6 lg:w-9 lg:h-9" />
    <p class="text-white inline ml-3 text-lg sm:text-xl md:text-[1.1em] lg:text-[1.3em]">Mensajes</p>
  </div>

  <!-- FaQ -->
  <div class="flex items-center py-3 sm:py-3 md:py-2 lg:py-3 px-3 cursor-pointer" (click)="onFaq()">
    <img src="svg/support.svg" class="inline w-8 h-8 sm:w-8 sm:h-8 md:w-6 md:h-6 lg:w-9 lg:h-9" />
    <p class="text-white inline ml-3 text-lg sm:text-xl md:text-[1.1em] lg:text-[1.3em]">
      Soporte y preguntas frecuentes
    </p>
  </div>

  <!-- Logout -->
  <div class="flex items-center py-3 sm:py-3 md:py-2 lg:py-3 px-3 mt-4 cursor-pointer" (click)="logout()" routerLink="home">
    <img src="svg/logout.svg" class="inline w-8 h-8 sm:w-8 sm:h-8 md:w-6 md:h-6 lg:w-9 lg:h-9" />
    <p class="text-white inline ml-3 text-lg sm:text-xl md:text-[1.1em] lg:text-[1.3em]">
      Cerrar sesión
    </p>
  </div>
</div>
