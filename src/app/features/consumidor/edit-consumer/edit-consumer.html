<div
    class="bg-white p-6 sm:p-8 rounded-lg shadow-md w-170 max-w-sm relative border border-gray-200 overflow-y-auto max-h-[90vh]">
    <button class=" p-0.1 rounded cursor-pointer" appClosedialog>
        <img src="/svg/back-icon.svg" alt="">
    </button>
    <!-- perfil -->
    <div class="flex justify-center mb-6">
        <div class="relative w-32 h-32"> <img [src]="user?.image?.url || '/svg/profile.svg'" alt="Foto de perfil"
                class="w-32 h-32 rounded-full object-cover bg-blue-900" />
            <!--editar -->
            <div class="absolute bottom-2 right-2" for="upload"> <img src="/svg/edit.svg" alt="Editar"
                    class="w-8 h-8 rounded-full bg-white p-1 shadow-md cursor-pointer" /> </div>
        </div>
    </div>
    <!-- Formulario -->
    <form class="space-y-5">
        <div> <label class="block text-sm font-medium text-textosNoNegro pb-0.5" >Nombre:</label> <input value="{{user?.primer_nombre}}" type="text"
                class="inputs_registro w-full" > </div>
        <div> <label class="block text-sm font-medium text-gray-700 pb-0.5">Segundo Nombre:</label> <input value="{{user?.segundo_nombre}}" type="text"
                class="inputs_registro w-full"> </div>
        <div> <label class="block text-sm font-medium text-gray-700 pb-0.5">Apellido:</label> <input value="{{user?.primer_apellido}}" type="text"
                class="inputs_registro w-full"> </div>
        <div> <label class="block text-sm font-medium text-gray-700 pb-0.5">Segundo Apellido:</label> <input value="{{user?.segundo_apellido}}" type="text"
                class="inputs_registro w-full"> </div>
        <div> <label class="block text-sm font-medium text-gray-700 pb-0.5">Correo:</label> <input value="{{user?.email}}" type="text"
                class="inputs_registro w-full"> </div>

        <div class="flex justify-center items-center space-x-4 pt-4"> <button class="btn_negative"
                appClosedialog>Cancelar</button>
            <button class="btn_positive">Guardar</button>
        </div>
    </form>
</div>
