<!-- Contenedor de publicaciones -->
<section class="flex flex-wrap md:m-10 justify-center gap-1 md:gap-4 pt-12 md:pt-7 overflow-x-hidden">

    @if (publications) {
    @for (publication of publications; track $index) {

    <!-- Contenedor de publicacion -->
    <div class="div_publicacion" (click)="openProductDetail(publication)">
        <!--  {{-- Imagen --}} -->
        <div [ngStyle]="{'background-image': 'url(' + publication.image!.url + ')'}" class="flex w justify-end items-end  select-none
            h-[65%] bg-cover bg-center border-[1px] border-borde2 rounded-md">
            <!--  {{-- Estrellas: cada img es un tipo de estrella --}} -->
            <div class="m-2 flex">
            @for (star of [1,2,3,4,5]; track $index) {
            <span class="text-3xl" [class.text-yellow-400]="star <= publication.puntuacion_promedio!"
              [class.text-blue-900]="star > publication.puntuacion_promedio!">
              &#9733;
            </span>
            }
            </div>
        </div>

        <!-- {{-- Contenedor de titulo y precio --}} -->
        <div class="div_tituloPrecio">
            <!-- {{-- Titulo --}} -->
            <p class="text-[20px] h-full md:text-[26px] overflow-hidden line-clamp-2 text-ellipsis text-nowrap">
                {{publication.titulo}}</p>
            <!-- {{-- Precio --}} -->
            <span class="text-[20px] md:text-[30px]">{{publication.precio | currency:'COP':'symbol':'1.0-0'}}</span>
        </div>
    </div>
    }
    }

</section>
<div class="fixed top-16 right-1 h-[calc(100vh-4rem)] w-[280px] md:w-[320px] shadow-lg z-41 transition-transform duration-300 transform"
    [class.translate-x-0]="open" [class.translate-x-full]="!open">
    @if (publication_selected) {
    <div class="h-full w-full">
        <app-product-detail 
            [publication_detail]="publication_selected" 
            (close)="closePublicationDetail()"> <!-- Agregar output event -->
        </app-product-detail>
    </div>
    }
</div>
