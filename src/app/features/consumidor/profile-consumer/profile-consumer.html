<!-- Card de perfil -->
<div
  class=" border ProfilConsumer  rounded-xl p-6 mx-auto flex flex-col items-center shadow mt-10 w-full max-w-[400px] relative">

  <!-- Botón volver -->
  <div class="absolute top-4 left-4">
    <button class="rounded-md p-1 transition cursor-pointer" (click)="goBack()">
      <img src="svg/back-icon.svg" class="w-9 h-9">
    </button>
  </div>

  <!-- icono-perfil y botón editar -->
  <div class="relative mb-6 mt-6">
    <div class="bg-[#06406A] rounded-full w-36 h-36 flex items-center justify-center">
      <img [src]="user?.image?.url || 'svg/profile.svg'" alt="Avatar" class="object-cover rounded-full w-full h-full">
    </div>
  </div>

  <!-- Formulario de datos -->
  <form class="w-full flex flex-col gap-3">
    <label class="inputProfilConsumer">Nombre</label>
    <input type="text" value="{{user?.primer_nombre}} {{user?.segundo_nombre}}" disabled
      class="rounded-md border border-gray-300 px-3 py-1 bg-gray-100 text-gray-500 inputProfileOther text-base">

    <label class="inputProfilConsumer">Apellidos</label>
    <input type="text" value="{{user?.primer_apellido}} {{user?.segundo_apellido}}" disabled
      class="rounded-md border border-gray-300 px-3 py-1 bg-gray-100 text-gray-500 inputProfileOther text-base">

    <label class="inputProfilConsumer">Correo</label>
    <input type="email" value="{{user?.email}}" disabled
      class="rounded-md border border-gray-300 px-3 py-1 bg-gray-100 text-gray-500 inputProfileOther text-base">

    <button type="button"
      class="mt-4 px-4 py-1 rounded-md bg-gray-100 text-[#06406A] border border-gray-200 self-center inputProfileOther dark:border-gray-600  dark:text-darkTextosNoNegro cursor-pointer" (click)="onOpenEditConsumer()">
      Editar datos
    </button>
  </form>
</div>
