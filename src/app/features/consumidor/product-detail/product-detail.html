@if (publication_detail) {

<div
    class="border border-gray-500 bg-white w-full overflow-y-auto overflow-x-hidden max-w-sm h-full rounded-md font-sans p-4 space-y-4">
    <!-- Header con botones -->
    <div class="flex justify-between items-center">
        <button class="rounded-lg w-10 h-10 border-0 flex items-center justify-center"
            (click)="removePublicationDetail()">
            <img src="svg/back-icon.svg" alt="atras" class="w-15 h-15">
        </button>
        <button class="rounded-lg border-0 w-10 h-10 flex items-center justify-center">
            <img src="svg/trespuntos.svg" alt="puntos" class="w-7 h-7">
        </button>
    </div>

    <!-- Título -->
    <h2 class="text-2xl font-semibold">{{publication_detail.titulo}}</h2>

    <!-- Imagen del producto -->
    <div [ngStyle]="{'background-image': 'url(' + publication_detail.image!.url + ')'}"
        class="border border-gray-500 w-full aspect-square rounded-md bg-cover bg-center"></div>

    <!-- Precio y botón favorito -->
    <div class="flex justify-between items-center">
        <p class="text-gray-500 text-xl font-semibold">{{publication_detail.precio | currency: 'COP'}}</p>
        <button class="bg-transparent">
            <img src="svg/favoritooscuro.svg" alt="corazon" class="w-6 h-6">
        </button>
    </div>

    <!-- Estrellas -->
    <div>
        <img class="w-24" src="svg/stars.svg" alt="estrella">
    </div>

    <!-- Descripción -->
    <div class="bg-gray-100 rounded-lg p-4">
        <h3 class="font-semibold mb-2">Descripción</h3>
        <p class="text-sm text-gray-700 leading-relaxed">
            {{publication_detail.descripcion}}
        </p>
    </div>

    @if (publication_detail.seller_id) { <!-- aqui es si es user_id! = seller_id -->
    <button class="bg-azulSecundario text-white w-full h-10 rounded-lg font-medium">Mandar mensaje</button>

    }

    <!-- Usuario vendedor -->
    <div class="bg-gray-300 rounded-xl p-4 flex items-center space-x-4">
        <img class="w-10 h-10 rounded-full" src="svg/userProfiel.svg" alt="foto">
        <p class="font-medium">{{publication_detail.seller_id}} ahi veo q colocar</p>
    </div>

    <!-- Botones y mapa -->
    <div class="space-y-4">
        <button class="bg-[#144467] text-white w-full h-10 rounded-lg font-medium">Ver ubicación</button>
        <div class="w-full aspect-square rounded-lg overflow-hidden">
            <iframe class="w-full h-full"
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1992.160176789594!2d-76.48352223851431!3d3.0082367277367377!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8e307f3134b20a77%3A0xcb8ce9e4a1c72448!2sSENA%20Regional%20Cauca!5e0!3m2!1ses-419!2sco!4v1750977951386!5m2!1ses-419!2sco"
                allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
    </div>

    <!-- Comentarios -->
     <div class="my-5">
    <app-comments [publication_id]="publication_detail.id!" [seller_id]="publication_detail.seller_id!"></app-comments>

     </div>

</div>
}
