<div class="flex justify-center w-full mb-[15px]" (click)="cerrarMenus()">
    <div class="fixed flex justify-between items-center bg-white mt-[-10px] px-[2%] py-1.5 z-39 w-full">
        <!-- Filtrar -->
        <app-filters [isAbierto]="isAbierto" (isAbiertoChange)="isAbierto = $event"></app-filters>

        <!-- Ubicacion -->
        <div class="z-50">
            <div class="text-azulSecundario cursor-pointer flex items-center" (click)="openMapDialog()">
                <img src="svg/location.svg" class="mr-2" alt="">
                {{user_coordinate?.direccion || 'Seleccionar ubicación'}}
            </div>
        </div>
    </div>

</div>
<div (click)="cerrarMenus()">
    <app-publications></app-publications>
</div>
