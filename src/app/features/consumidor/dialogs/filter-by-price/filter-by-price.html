<div class="w-[22.5em] md:w-[25.37em] h-[fit] p-5 bgDialogs_general border border-gray-400 rounded-xl">

  <!-- Botón para volver atrás -->
  <button class="rounded-md border border-white" appClosedialog>
    <img src="svg/back-icon.svg" alt="">
  </button>

  <!-- Título de la sección -->
  <h2 class="text-azulPotente text-[2em] md:text-[35px] font-medium text-center w-full">Filtrar por precio</h2>

  <!-- Inputs de mínimo y máximo -->
  <div class="flex flex-col justify-self-center gap-5 py-4">

    <label for="">
    <p class="text-[22px]">Precio minimo:</p>

    <input type="number" placeholder="Minimo" [(ngModel)]="min_price"
      class="bgDialogs_general w-[12.25em] h-[4.56em] rounded-md border border-[#c2c2c2] text-center placeholder-[#c2c2c2]">
    </label>
      
    <label for="">
    <p class="text-[22px]">Precio maximo:</p>
    <input type="number" placeholder="Maximo" [(ngModel)]="max_price"
      class="bgDialogs_general w-[12.25em] h-[4.56em] rounded-md border border-[#c2c2c2] text-center placeholder-[#c2c2c2]">
    </label>

  </div>


  <!-- Botón de acción -->
  <div class="flex justify-center">
    <button type="submit" (click)="applyFilter()" class="bg-[#063E67] text-white w-[6.5em] h-[2.5em] rounded-md 
    hover:bg-[#0369a1] text-[20px] disabled:bg-borde1 active:bg-[#063E67]" [disabled]="min_price>max_price&&max_price!=null">
      Aceptar
    </button>
  </div>
</div>
