<div class="w-[22.5em] md:w-[25.37em] h-[fit] p-5 bgDialogs_general border border-gray-400 rounded-xl">
  
  <!-- Botón para volver atrás -->
  <button class="rounded-md " appClosedialog>
    <img src="svg/back-icon.svg" alt="">
  </button>

  <!-- Título de la sección -->
  <h2 class="text-azulPotente text-[2em] md:text-[35px] font-medium text-center w-full">Filtrar por categoria</h2>

  <!-- Opciones de categoría -->
  <div class="mt-4 p-2 md:p-5">
    <label class="block ml-10 md:ml:30 mb-4 text-[22px]">
      <input type="checkbox" class="mr-2 size-4" [value]="1"  (change)="onCategoryChange($event.target.checked, 1)"> Electrodomesticos
    </label>
    <label class="block ml-10 md:ml:30 mb-4 text-[22px]">
      <input type="checkbox" class="mr-2 size-4" [value]="2"  (change)="onCategoryChange($event.target.checked, 2)"> Alimentos
    </label>
    <label class="block ml-10 md:ml:30 mb-4 text-[22px]">
      <input type="checkbox" class="mr-2 size-4" [value]="3"  (change)="onCategoryChange($event.target.checked, 3)"> Entretenimiento
    </label>
    <label class="block ml-10 md:ml:30 mb-4 text-[22px]">
      <input type="checkbox" class="mr-2 size-4" [value]="4"  (change)="onCategoryChange($event.target.checked, 4)"> Muebles
    </label>
  </div>

  <!-- Botón de acción -->
  <div class="flex justify-center">
    <button (click)="applyFilter()" class="bg-[#063E67] text-white w-[6.5em] h-[2.5em] rounded-md 
    hover:bg-[#0369a1] text-[20px]" appClosedialog>
      Aceptar
    </button>
  </div>
</div>
