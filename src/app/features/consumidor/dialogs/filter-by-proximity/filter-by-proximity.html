<!-- CERCANÍA -->
<div class="w-[22.5em] md:w-[25.37em] h-[fit] p-5 bg-white border border-gray-400 rounded-xl">
  
  <!-- Botón para volver atrás -->
  <button class="rounded-md border border-white">
    <img src="svg/back-icon.svg" alt="" appClosedialog>
  </button>

  <!-- Título de la sección -->
  <h2 class="text-azulPotente text-[2em] md:text-[35px] font-medium text-center w-full">Filtrar por cercania</h2>

  <!-- Opciones de cercanía -->
  <div class="mt-4">
    <label class="block ml-10 md:ml:30 mb-4 text-[22px] w-full">
      <input type="checkbox" class="mr-2 size-4"> Cerca de mí
    </label>
    <label class="block ml-10 md:ml:30 mb-4 text-[22px]">
      <input type="checkbox" class="mr-2 size-4"> Todos los lugares
    </label>
    <label class="block ml-10 md:ml:30 mb-4 text-[22px]">
      <input type="checkbox" class="mr-2 size-4"> Distancia personalizada
    </label>

    <!-- Campo para ingresar la distancia -->
    <label class="block ml-10 md:ml:30 mb-4">
      <input type="text" placeholder="Ingrese distancia personalizada" class="bg-[#f6f6f6] w-full h-[4.56em] rounded-md border border-[#c2c2c2] text-center placeholder-[#c2c2c2]">
    </label>
  </div>

  <!-- Botón de acción -->
  <div class="flex justify-center">
    <button type="submit" class="bg-[#063E67] text-white w-[6.5em] h-[2.5em] rounded-md 
    hover:bg-[#0369a1] text-[20px] disabled:bg-borde1 active:bg-[#063E67]">
      Aceptar
    </button>
  </div>
</div>
