<div class="bg-white w-[22.5em] md:w-[95vw] md:max-w-[60em] text-textosNoNegro p-3 h-[95vh] md:h-[90vh] max-h-[calc(105vh-4rem)] md:max-h-[calc(140vh-4rem)] z-50 overflow-auto rounded-2xl flex flex-col mx-auto">

  <!-- Botón para volver atrás -->
  <button class="rounded-md border border-white flex-shrink-0" appClosedialog>
    <img src="svg/back-icon.svg" alt="">
  </button>

    <h2 class="text-azulPotente text-[2em] md:text-[35px] font-medium text-center w-full flex-shrink-0">Selecciona tu ubicación</h2>

    <!-- Mapa -->
    <div id='gmap_canvas' class="border border-borde2 rounded-2xl mx-2 md:mx-4 flex-1 min-h-[20em]">
    </div>

    <!-- Coordenadas -->
<div class="text-center text-sm text-gray-600 my-4 flex-shrink-0">
    <p>Latitud: {{ coordinate.latitud.toFixed(4) }}</p>
    <p>Longitud: {{ coordinate.longitud.toFixed(4) }}</p>
</div>

    <!-- Botones -->
    <div class="flex justify-center gap-x-4 mb-4 flex-shrink-0">
        <button class="btn_negative" appClosedialog>Cancelar</button>
        <button class="btn_positive" (click)="OnConfirmar()">Confirmar</button>
    </div>
</div>
