<div class="bg-white border-3 border-borde1 rounded-lg relative h-full z-10 p-2">
    <div class="grid grid-rows-[auto_1fr_auto] h-full min-h-0">
        <!-- Header -->
        <div class="flex items-center gap-3 border-b border-borde2 rounded-t-lg p-2">
            <img src="svg/back-icon.svg" class="cursor-pointer w-6 h-6" onclick="">
            <div class="w-14 h-14 md:w-16 md:h-16 bg-gray-100 overflow-hidden rounded-full shadow">
                <img src="img/florhuila.png" alt="" class="w-full h-full object-cover" />
            </div>
            <p class="text-azulPotente font-semibold text-[1.2em] md:text-[1.6em]">
                Harina xxxxg $xxxxx (juan)
            </p>
        </div>

        <!-- Cuerpo del chat -->
        <div class="overflow-y-auto p-4 space-y-6 min-h-0">
            <div class="flex justify-center">
                <p class="text-sm bg-gray-200 text-gray-700 px-4 py-1 rounded-full">Ayer</p>
            </div>
            <div class="flex flex-col space-y-2">
                <div class="max-w-[70%] bg-gray-100 text-black px-4 py-2 rounded-lg w-fit">Hola, ¿cómo estás?</div>
                <div class="max-w-[70%] bg-azulSecundario text-white px-4 py-2 rounded-lg w-fit self-end">Bien, gracias. ¿Y tú?</div>
            </div>

            <div class="flex justify-center">
                <p class="text-sm bg-gray-200 text-gray-700 px-4 py-1 rounded-full">Hoy</p>
            </div>
            <div class="flex flex-col space-y-2">
                <div class="max-w-[70%] bg-gray-100 text-black px-4 py-2 rounded-lg w-fit">Te mandé la foto del producto.</div>
                <div class="max-w-[70%] bg-azulSecundario text-white px-4 py-2 rounded-lg w-fit self-end">¡Ya la vi! Gracias.</div>
            </div>
        </div>

        <!-- Input del mensaje -->
        <div class="p-2 flex items-center gap-2 border-t border-borde2">
            <input type="text" class="flex-1 border border-borde1 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-azulPotente" placeholder="Escribe aquí...">
            <button>
                <img src="svg/enviar.svg" alt="Enviar" class="w-7 h-7">
            </button>
        </div>
    </div>
</div>
