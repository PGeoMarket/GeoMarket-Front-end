<div
    class="border border-gray-300 rounded-xl p-2 md:p-4 flex flex-col md:flex-row gap-4 md:gap-6 profileOther_Bg shadow h-auto md:h-[calc(100vh-80px)] overflow-hidden overflow-y-auto">
    <!-- Perfil vendedor -->
    <div
        class="w-full md:w-[370px] flex-shrink-0 flex flex-col border border-gray-300 rounded-xl p-4 md:p-6 profileOtherProfile_Bg relative mb-2 md:mb-0 md:overflow-auto">
        <!-- Botón editar datos -->
        <button
            class="absolute top-4 right-4 bg-gray-100 rounded-md px-4 py-1 text-sm text-gray-700 shadow hover:bg-gray-200 z-1 cursor-pointer"
            (click)="onOpenEdit()">
            Editar datos
        </button>
        <!-- icono perfil -->
        <div class="flex flex-col items-center mb-4 mt-2">
            <div class="relative w-32 h-32 rounded-full overflow-hidden border border-borde1 my-3 mx-auto">
                <img [src]="user?.image?.url || '/svg/profile.svg'" alt="Avatar"
                    class="w-full h-full object-cover rounded-full">
            </div>
            <div class="m-2 flex bottom-0">
                @for (star of [1,2,3,4,5]; track $index) {
                <span class="text-3xl" [class.text-yellow-400]="star <= user?.seller?.puntuacion_promedio!"
                    [class.text-blue-900]="star > user?.seller?.puntuacion_promedio!">
                    &#9733;
                </span>
                }
            </div>
        </div>
        <!-- Info -->
        <form class="w-full flex flex-col gap-3">
            <label class="profileOther_textOnLabel text-sm">Nombre</label>
            <input type="text" value="{{user?.primer_nombre}} {{user?.segundo_nombre}}" disabled
                class="rounded-md border border-gray-300 px-3 py-1 inputProfileOther text-base">

            <label class="profileOther_textOnLabel text-sm">Negocio</label>
            <input type="text" value="{{user?.seller?.nombre_tienda}}" disabled
                class="rounded-md border border-gray-300 px-3 py-1 inputProfileOther text-base">

            <label class="profileOther_textOnLabel text-sm">Correo</label>
            <input type="email" value="{{user?.email}}" disabled
                class="rounded-md border border-gray-300 px-3 py-1 inputProfileOther text-base">

            <!-- Teléfono Principal -->
            <label class="profileOther_textOnLabel text-sm">Teléfono Principal</label>
            <input type="tel" [value]="user?.seller?.phones?.[0]?.numero_telefono"
                class="rounded-md border border-gray-300 px-3 py-1 inputProfileOther text-base">

            <!-- Teléfono Secundario (Nuevo campo añadido) -->
            <label class="profileOther_textOnLabel text-sm">Teléfono Secundario</label>
            <input type="tel" [value]="user?.seller?.phones?.[1]?.numero_telefono"
                class="rounded-md border border-gray-300 px-3 py-1 inputProfileOther text-base">

            <label class="profileOther_textOnLabel text-sm">Dirección</label>
            <input type="text" [value]="user?.seller?.coordinate?.direccion" disabled
                class="rounded-md border border-gray-300 px-3 py-1 inputProfileOther text-base">
            <label class="profileOther_textOnLabel text-sm">Descripción de la tienda:</label>
            <textarea [value]="user?.seller?.descripcion" disabled
                class="rounded-md border border-gray-300 px-3 py-1 inputProfileOther text-base h-[100px] max-h-[500px] resize-none"></textarea>
        </form>

        <!-- Mapa, botón y estrellas -->
        <div class="flex items-end gap-2 mt-6 w-full mb-8">
            <div class="relative">
                <app-mini-map [coordinate]="coordinate"></app-mini-map>
                <button
                    class="absolute left-2  bg-[#06406A] text-white rounded-md px-4 py-1 text-base font-semibold shadow hover:bg-[#05345a] cursor-pointer"
                    (click)="openMapSellerDialog()">
                    Editar ubicación
                </button>
            </div>
        </div>
    </div>

    <!-- Catálogo y comentarios -->
    <div class="flex-1 flex flex-col min-w-0" x-data="{ tab: 'catalogo' }">
        <!-- Tabs -->
        <div class="flex gap-2 mb-4">
            <button [ngClass]="tab === 'catalogo' ? 'bg-[#06406A] text-white' : 'bg-gray-200 text-gray-700'"
                class="px-5 py-2 rounded-md text-base font-semibold shadow focus:outline-none cursor-pointer"
                (click)="tab = 'catalogo'">
                Catálogo
            </button>

            <button [ngClass]="tab === 'comentarios' ? 'bg-[#06406A] text-white' : 'bg-gray-200 text-gray-700'"
                class="px-5 py-2 rounded-md text-base font-semibold shadow focus:outline-none cursor-pointer"
                (click)="tab = 'comentarios'">
                Comentarios
            </button>
        </div>

        <!-- Contenido de las pestañas -->
        <div class="flex-1 min-h-0 relative">
            <!-- Catálogo grid con scroll -->
            @if (tab=="catalogo" || !tab) {

            <div class="h-full overflow-x-hidden">
                <app-filters [isAbierto]="isAbierto" (isAbiertoChange)="isAbierto = !isAbierto" [fromProfile]="true"
                    class="w-full mx-[10%]"></app-filters>

                    <app-edit-publication (click)="cerrarMenus()"></app-edit-publication>
            </div>
            }

            <!-- Comentarios dinámicos -->
            @if (tab=="comentarios") {
            <div class="flex-1 overflow-y-auto pr-2">
                <app-comments-profile [useCurrentUserSeller]="true"></app-comments-profile>
            </div>
            }
        </div>
    </div>
</div>
