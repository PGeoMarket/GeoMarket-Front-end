<div class="flex flex-col gap-2">
  <!-- Si no hay comentarios -->
  <div *ngIf="comments.length === 0" class="text-gray-400 text-xs">
    No hay comentarios en esta publicación todavía.
  </div>

  <!-- Lista de comentarios -->
  <div *ngFor="let comment of comments"
       class="flex items-center border rounded-lg bg-white shadow px-2 py-1 relative">

    <!-- Avatar -->
    <img [src]="comment.user?.image?.url || '/svg/profile.svg'"
         class="w-8 h-8 bg-[#06406A] rounded-full mr-2 object-cover"
         alt="avatar">

    <!-- Datos -->
    <div class="flex-1">
      <div class="font-medium text-xs text-[#06406A]">
        {{ comment.user?.primer_nombre }} {{ comment.user?.primer_apellido }}
      </div>
      <div class="text-xs text-gray-600">
        {{ comment.texto }}
      </div>
      <div class="text-[10px] text-gray-400">
        {{ comment.created_at | date:'shortDate' }}
      </div>
    </div>

    <!-- Estrellas -->
    <div class="flex items-center ml-2 text-yellow-500 text-xs">
      ⭐ {{ comment.valor_estrella || 0 }}
    </div>
  </div>
</div>
