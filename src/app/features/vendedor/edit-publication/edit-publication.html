<section class="flex flex-wrap md:m-10 justify-center gap-1 md:gap-4 md:pt-[0px] overflow-x-hidden " (click)="cerrarMenus()">
 @if (publications) {
     @for (publication of publications; track $index) {

    <!-- {{-- Contenedor de publicacion --}} -->
    <div class="div_publicacion relative"   (click)="openProductDetail(publication)">
        <!-- {{-- tres puntitos --}} -->
<div class="absolute top-2 right-2 z-30">
  <button (click)="abrirMenu($index, $event); $event.stopPropagation();"
          class="bg-gray-100 rounded-full w-7 h-7 flex items-center justify-center text-gray-500 hover:bg-gray-200 focus:outline-none">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="1.5" />
      <circle cx="12" cy="6" r="1.5" />
      <circle cx="12" cy="18" r="1.5" />
    </svg>
  </button>

  @if (editarIndex == $index) {
    <div class="absolute right-0 mt-2 bg-white border rounded shadow px-2 py-1 text-xs min-w-[80px] z-40"
         (click)="$event.stopPropagation()">
      <button
        class="block text-[#06406A] hover:underline w-full text-left py-1 px-1"
        (click)="onEditProduct(publication); $event.stopPropagation();">
        Editar
      </button>
      <button
        class="block text-red-500 hover:underline w-full text-left py-1 px-1"
        (click)="onDeleteProduct(publication.id!); $event.stopPropagation();">
        Eliminar
      </button>
    </div>
  }
</div>


        <!--  {{-- Imagen --}} -->
        <div [ngStyle]="{'background-image': 'url(' + publication.image!.url + ')'}" class="flex w justify-end items-end  select-none
            h-[65%] bg-cover bg-center border-[1px] border-borde2 rounded-md">
            <!--  {{-- Estrellas: cada img es un tipo de estrella --}} -->
            <div class="m-2 flex">
                <img src="svg/starFull.svg" class="estrella" alt="">
                <img src="svg/starHalf.svg" class="estrella" alt="">
                <img src="svg/starEmpty.svg" class="estrella" alt="">
                <img src="svg/starEmpty.svg" class="estrella" alt="">
                <img src="svg/starEmpty.svg" class="estrella" alt="">
            </div>
        </div>

        <!-- {{-- Contenedor de titulo y precio --}} -->
        <div class="div_tituloPrecio">
            <!-- {{-- Titulo --}} -->
            <p class="text-[20px] h-full md:text-[26px] overflow-hidden line-clamp-2 text-ellipsis text-nowrap">
                {{publication.titulo}}</p>
            <!-- {{-- Precio --}} -->
            <span class="text-[20px] md:text-[30px]">{{publication.precio | currency:'COP':'symbol':'1.0-0'}}</span>
        </div>
    </div>
    }
 }
</section>
<div class="fixed top-16 right-1 h-[calc(100vh-4rem)] w-[280px] md:w-[320px] shadow-lg z-41 transition-transform duration-300 transform"
    [class.translate-x-0]="open" [class.translate-x-full]="!open">
    @if (publication_selected) {
    <div class="h-full w-full">
        <app-product-detail 
            [publication_detail]="publication_selected" 
            (close)="closePublicationDetail()"> <!-- Agregar output event -->
        </app-product-detail>
    </div>
    }
</div>
