<div class="fixed bg-white h-[85%] text-textosNoNegro inset-x-[8%] inset-y-[10%] z-50 overflow-auto rounded-2xl">

    <div class="absolute top-2 left-1 cursor-pointer" appClosedialog>
        <img src="/svg/back-icon.svg" alt="Volver" class="w-8 h-8" appClosedialog>
    </div>

    <h1 class="text-center text-[32px] pt-2">Selecciona tu ubicación</h1>
    
    <!-- Mapa -->
    <div id='gmap_canvas' class="border border-borde2 rounded-2xl mx-3 md:mx-10 h-[70%] mt-4">
    </div>

    <!-- Coordenadas -->
<div class="text-center text-sm text-gray-600 my-4">
    <p>Latitud: {{ coordinate.latitud.toFixed(4) }}</p>
    <p>Longitud: {{ coordinate.longitud.toFixed(4) }}</p>
</div>

    <!-- Botones -->
    <div class="flex justify-center gap-x-4 mb-4">
        <button class="btn_negative" appClosedialog>Cancelar</button>
        <button class="btn_positive" (click)="OnConfirmar()">Confirmar</button>
    </div>
</div>
